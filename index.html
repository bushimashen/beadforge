<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeadForge · 拼豆图纸生成器 / Perler Bead Pattern Generator</title>
<meta name="description" content="把任意图片转成拼豆（Perler / MARD / COCO…）像素图纸：标准袋装色号、颜色清单、PNG 导出，全部在浏览器本地完成。" />
<meta name="theme-color" content="#0E1428" />
<style>
:root {
  --bg: #0A0F22;
  --surface: #131A31;
  --surface2: #1A2242;
  --text: #E8EEF9;
  --muted: #8FA2C0;
  --border: #2A3358;
  --primary: #4A90E2;
  --glow: #7C6CE8;
  --accent: linear-gradient(135deg, var(--primary), var(--glow));
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 700px at 50% -10%, #1B2447 0%, var(--bg) 60%);
  color: var(--text);
  font: 14px/1.6 "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  min-height: 100vh;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
header { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
header .titles { flex: 1; min-width: 260px; }
h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .3px; }
h1 .sub { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.lead { margin: 0; color: var(--muted); font-size: 13px; max-width: 760px; }
.lang { display: flex; gap: 6px; }
.lang button, .seg button {
  background: var(--surface2); color: var(--muted); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 14px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.lang button.on, .seg button.on { background: var(--accent); color: #fff; border-color: transparent; }
.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px 20px; margin-bottom: 16px;
}
.panel-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 17px; }
.stats { color: var(--muted); font-size: 13px; }
.drop {
  border: 2px dashed var(--border); border-radius: 16px; background: var(--surface);
  color: var(--muted); padding: 64px 20px; text-align: center; cursor: pointer;
  transition: border-color .2s, background .2s;
}
.drop:hover, .drop.over { border-color: var(--primary); background: var(--surface2); }
.drop svg { color: var(--primary); margin-bottom: 10px; }
.drop .big { color: var(--text); font-size: 15px; margin: 0 0 6px; }
.drop .small { font-size: 12px; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 22px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.field label b { color: var(--text); }
select, input[type="range"] { width: 100%; }
select {
  background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; font-family: inherit; font-size: 13px;
}
input[type="range"] { accent-color: var(--primary); }
.hint { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
.presets { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.presets button {
  background: var(--surface2); color: var(--muted); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.presets button.on { color: #fff; background: var(--accent); border-color: transparent; }
.seg { display: flex; gap: 6px; }
.preview-wrap { overflow: auto; max-height: 62vh; border-radius: 10px; background: #0C1226; padding: 8px; }
canvas.preview { display: block; image-rendering: pixelated; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.legend li {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px;
  background: var(--surface2); border: 1px solid var(--border); cursor: pointer;
}
.legend li.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
.legend .swatch { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(255,255,255,.18); flex: none; }
.legend .code { font-weight: 700; font-size: 13px; }
.legend .name, .legend .hex { color: var(--muted); font-size: 11px; margin-left: 6px; }
.legend .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.actions button {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  border-radius: 10px; padding: 10px 16px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.actions button.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
.actions button:hover { filter: brightness(1.12); }
.tip { margin: 6px 0 10px; font-size: 12px; color: var(--muted); }
footer { margin-top: 26px; color: var(--muted); font-size: 12px; line-height: 1.8; }
footer a { color: var(--primary); text-decoration: none; }
footer a:hover { text-decoration: underline; }
.mono { font-family: Consolas, "Courier New", monospace; }
@media (max-width: 620px) {
  .wrap { padding: 18px 12px 40px; }
  h1 { font-size: 21px; }
  .drop { padding: 40px 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1>BeadForge<span class="sub" data-i18n="tagline"></span></h1>
      <p class="lead" data-i18n="lead"></p>
    </div>
    <div class="lang">
      <button type="button" id="lang-zh" class="on">中文</button>
      <button type="button" id="lang-en">EN</button>
    </div>
  </header>

  <div class="drop" id="drop">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="9" cy="9" r="2" /><path d="M21 15l-4.5-4.5L7 20" />
    </svg>
    <p class="big" data-i18n="dropTitle"></p>
    <p class="small" data-i18n="dropSub"></p>
    <input type="file" id="file" accept="image/*" hidden />
  </div>

  <main id="main" hidden>
    <section class="panel">
      <div class="grid">
        <div class="field">
          <label data-i18n="brand"></label>
          <select id="brand"></select>
        </div>
        <div class="field">
          <label><span data-i18n="width"></span> <b id="wLabel">50</b></label>
          <input type="range" id="width" min="10" max="150" step="1" value="50" />
          <div class="presets" id="presets"></div>
        </div>
        <div class="field">
          <label><span data-i18n="brightness"></span> <b id="bLabel">0</b></label>
          <input type="range" id="brightness" min="-80" max="80" step="5" value="0" />
          <span class="hint" data-i18n="brightnessHint"></span>
        </div>
        <div class="field">
          <label data-i18n="maxColors"></label>
          <select id="maxColors"></select>
        </div>
        <div class="field">
          <label data-i18n="dither"></label>
          <div class="seg" id="dither">
            <button type="button" data-v="none" class="on"></button>
            <button type="button" data-v="fs"></button>
          </div>
          <span class="hint" data-i18n="ditherHint"></span>
        </div>
        <div class="field">
          <label data-i18n="shape"></label>
          <div class="seg" id="shape">
            <button type="button" data-v="circle" class="on"></button>
            <button type="button" data-v="square"></button>
          </div>
        </div>
        <div class="field">
          <label data-i18n="grid"></label>
          <div class="seg" id="showGrid">
            <button type="button" data-v="1" class="on"></button>
            <button type="button" data-v="0"></button>
          </div>
        </div>
        <div class="field">
          <label data-i18n="printCodes"></label>
          <div class="seg" id="printCodes">
            <button type="button" data-v="1" class="on"></button>
            <button type="button" data-v="0"></button>
          </div>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button type="button" class="actions" id="reset" style="border-radius:10px;padding:9px 14px;background:var(--surface2);color:var(--text);border:1px solid var(--border);cursor:pointer" data-i18n="changeImage"></button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="preview"></h2>
        <span class="stats" id="stats"></span>
      </div>
      <p class="tip" id="alphaTip" hidden data-i18n="alphaTip"></p>
      <p class="tip" id="hlTip" hidden></p>
      <div class="preview-wrap"><canvas class="preview" id="preview"></canvas></div>
    </section>

    <section class="panel" id="legendPanel" hidden>
      <div class="panel-head">
        <h2 id="legendTitle"></h2>
        <span class="stats" id="legendHint"></span>
      </div>
      <ul class="legend" id="legend"></ul>
      <div class="actions">
        <button type="button" class="primary" id="dlFull" data-i18n="dlFull"></button>
        <button type="button" id="dlPlain" data-i18n="dlPlain"></button>
        <button type="button" id="dlCsv" data-i18n="dlCsv"></button>
      </div>
    </section>
  </main>

  <footer>
    <div data-i18n="privacy"></div>
    <div>BeadForge · <span data-i18n="licenseNote"></span> · <a href="LICENSE">LICENSE</a> · <a href="https://github.com/bushimashen/beadforge" target="_blank" rel="noopener">GitHub</a> · <a href="https://gitee.com/codegoder/beadforge" target="_blank" rel="noopener">Gitee</a></div>
  </footer>
</div>

function parsePalette(raw) {
  return raw.split(',').map((s) => {
    const [code, hex] = s.split('=');
    return { code, hex, rgb: [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)], name: '', en: '' };
  });
}
function parsePerler(raw) {
  return raw.split(',').map((s) => {
    const [code, rest] = s.split('=');
    const [hex, name, en] = rest.split('|');
    return { code, hex, rgb: [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)], name: name || '', en: en || '' };
  });
}

  { id: 'coco', name: 'COCO', note: '291', colors: parsePalette(PAL_RAW.coco) },

/**
 * 近似色距离（redmean 加权欧氏距离）：人眼对绿色更敏感，
 * 纯 RGB 欧氏距离会把「偏灰的红」和「偏灰的橙」混在一起，加权后更贴近观感。
 */
function colorDistance(r1, g1, b1, r2, g2, b2) {
  const rMean = (r1 + r2) / 2;
  const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
  return (2 + rMean / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rMean) / 256) * db * db;
}

/* ---------- 2. 状态 ---------- */
const S = {
  brand: 'mard',
  width: 50,
  brightness: 0,
  dither: 'none',
  maxColors: 24,
  shape: 'circle',
  showGrid: true,
  printCodes: true,
  lang: 'zh'
};
let img = null;          // 已加载的源图
let grid = new Int16Array(0); // 调色板下标，-1 = 留空（透明）
let gridH = 0;
let legend = [];         // [{code,hex,name,en,count}]
let stats = null;        // {w,h,beads,transparent}
let highlight = null;   // 高亮的色号
let objectUrl = '';

const pal = () => BRANDS.find((b) => b.id === S.brand).colors;
const brandName = () => BRANDS.find((b) => b.id === S.brand).name;

/** 最多颜色数档位：6/12/24/36 后逐级递增，封顶当前品牌色卡总色数 */
function maxColorOptions() {
  const max = pal().length;
  const opts = [6, 12, 24, 36];
  let v = 36, step = 12;
  while (v < max) { v += step; step += 4; opts.push(v >= max ? max : v); }
  if (opts[opts.length - 1] < max) opts.push(max);
  return opts;
}

/* ---------- 3. 核心：生成图纸 ---------- */
function generate() {
  if (!img) return;
  const colors = pal();
  const w = S.width;
  const h = Math.max(1, Math.round((S.width * img.naturalHeight) / img.naturalWidth));

  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const ctx = off.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;

  const bright = S.brightness;
  const px = new Float32Array(w * h * 3);
  const alpha = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    alpha[i] = data[i * 4 + 3];
    if (alpha[i] >= 120) {
      px[i * 3] = data[i * 4] + bright;
      px[i * 3 + 1] = data[i * 4 + 1] + bright;
      px[i * 3 + 2] = data[i * 4 + 2] + bright;
    }
  }
  const clamp255 = (v) => (v < 0 ? 0 : v > 255 ? 255 : v);
  const next = new Int16Array(w * h);
  let transparent = 0;

  if (S.dither === 'fs') {
    // Floyd–Steinberg 误差扩散：右 7/16、左下 3/16、下 5/16、右下 1/16。透明像素不参与扩散
    const spread = (x, y, f, er, eg, eb) => {
      if (x < 0 || x >= w || y >= h) return;
      const i = y * w + x;
      if (alpha[i] < 120) return;
      const j = i * 3;
      px[j] += er * f; px[j + 1] += eg * f; px[j + 2] += eb * f;
    };
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (alpha[i] < 120) { next[i] = -1; transparent++; continue; }
        const j = i * 3;
        const r = clamp255(px[j]), g = clamp255(px[j + 1]), b = clamp255(px[j + 2]);
        const idx = nearest(r, g, b, colors);
        next[i] = idx;
        spread(x + 1, y, 7 / 16, r - colors[idx].rgb[0], g - colors[idx].rgb[1], b - colors[idx].rgb[2]);
        spread(x - 1, y + 1, 3 / 16, r - colors[idx].rgb[0], g - colors[idx].rgb[1], b - colors[idx].rgb[2]);
        spread(x, y + 1, 5 / 16, r - colors[idx].rgb[0], g - colors[idx].rgb[1], b - colors[idx].rgb[2]);
        spread(x + 1, y + 1, 1 / 16, r - colors[idx].rgb[0], g - colors[idx].rgb[1], b - colors[idx].rgb[2]);
      }
    }
  } else {
    for (let i = 0; i < w * h; i++) {
      if (alpha[i] < 120) { next[i] = -1; transparent++; continue; }
      const j = i * 3;
      next[i] = nearest(clamp255(px[j]), clamp255(px[j + 1]), clamp255(px[j + 2]), colors);
    }
  }

  /* 颜色超限时反复剔除用量最少的颜色，把它并入仍在使用的颜色。
     存活集合只包含实际用到的颜色，避免被映射回已剔除的颜色导致超限 */
  const alive = new Set();
  for (const idx of next) if (idx >= 0) alive.add(idx);
  while (alive.size > S.maxColors) {
    const counts = new Map();
    for (const idx of next) if (idx >= 0) counts.set(idx, (counts.get(idx) || 0) + 1);
    let minIdx = -1, minCount = Infinity;
    for (const [idx, count] of counts) if (count < minCount) { minCount = count; minIdx = idx; }
    if (minIdx < 0) break;
    alive.delete(minIdx);
    for (let i = 0; i < next.length; i++) {
      if (next[i] === minIdx) {
        const j = i * 3;
        next[i] = nearest(clamp255(px[j]), clamp255(px[j + 1]), clamp255(px[j + 2]), colors, alive);
      }
    }
  }

  grid = next; gridH = h;
  const finalCounts = new Map();
  let beads = 0;
  for (const idx of next) if (idx >= 0) { finalCounts.set(idx, (finalCounts.get(idx) || 0) + 1); beads++; }
  legend = [...finalCounts.entries()].map(([idx, count]) => ({ ...colors[idx], count })).sort((a, b) => b.count - a.count);
  stats = { w, h, beads, transparent };
  renderPreview();
  renderLegend();
}

function nearest(r, g, b, palette, allowed = null) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < palette.length; i++) {
    if (allowed && !allowed.has(i)) continue;
    const p = palette[i].rgb;
    const d = colorDistance(r, g, b, p[0], p[1], p[2]);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

/* ---------- 4. 预览 ---------- */
function renderPreview() {
  const canvas = document.getElementById('preview');
  if (!canvas || !grid.length) return;
  const colors = pal();
  const cell = 16;
  const w = stats.w, h = gridH;
  canvas.width = w * cell; canvas.height = h * cell;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const hlIdx = highlight ? colors.findIndex((p) => p.code === highlight) : -1;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = grid[y * w + x];
      const px = x * cell, py = y * cell;
      if (idx < 0) {
        ctx.fillStyle = '#e9edf2'; ctx.fillRect(px, py, cell, cell);
        ctx.fillStyle = '#dde3ea';
        ctx.fillRect(px + cell / 2, py, cell / 2, cell / 2);
        ctx.fillRect(px, py + cell / 2, cell / 2, cell / 2);
        continue;
      }
      ctx.globalAlpha = hlIdx >= 0 && idx !== hlIdx ? 0.16 : 1;
      ctx.fillStyle = colors[idx].hex;
      if (S.shape === 'square') {
        ctx.fillRect(px, py, cell, cell);
      } else {
        ctx.fillRect(px, py, cell, cell);
        ctx.beginPath(); ctx.arc(px + cell / 2, py + cell / 2, cell / 2 - 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + cell / 2 - 1.5, py + cell / 2 - 1.5, cell / 6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  if (S.showGrid) {
    ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 1;
    for (let x = 0; x <= w; x++) {
      ctx.globalAlpha = x % 10 === 0 ? 0.9 : 1;
      ctx.beginPath(); ctx.moveTo(x * cell + 0.5, 0); ctx.lineTo(x * cell + 0.5, h * cell); ctx.stroke();
    }
    for (let y = 0; y <= h; y++) {
      ctx.globalAlpha = y % 10 === 0 ? 0.9 : 1;
      ctx.beginPath(); ctx.moveTo(0, y * cell + 0.5); ctx.lineTo(w * cell, y * cell + 0.5); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

function renderLegend() {
  const ul = document.getElementById('legend');
  ul.innerHTML = '';
  legend.forEach((c) => {
    const li = document.createElement('li');
    li.className = highlight === c.code ? 'on' : '';
    const label = S.lang === 'zh' ? (c.name || c.code) : (c.en || c.code);
    li.innerHTML = '<span class="swatch" style="background:' + c.hex + '"></span>' +
      '<span><span class="code">' + c.code + '</span>' +
      (label !== c.code ? '<span class="name">' + label + '</span>' : '') +
      '<span class="hex">' + c.hex + '</span></span>' +
      '<span class="count">×' + c.count.toLocaleString() + '</span>';
    li.onclick = () => { highlight = highlight === c.code ? null : c.code; renderPreview(); renderLegend(); };
    ul.appendChild(li);
  });
  document.getElementById('legendPanel').hidden = legend.length === 0;
  document.getElementById('legendTitle').textContent = t('legendTitle') + '（' + legend.length + '）';
  document.getElementById('legendHint').textContent = t('legendHint').replace('{brand}', brandName());
  document.getElementById('stats').textContent = stats.w + ' × ' + stats.h + ' ' + t('unitBead') + ' · ' +
    legend.length + ' ' + t('unitColor') + ' · ' + t('totalBeads') + ' ' + stats.beads.toLocaleString() + ' ' + t('unitPiece');
  document.getElementById('alphaTip').hidden = !stats.transparent;
  const hlTip = document.getElementById('hlTip');
  hlTip.hidden = !highlight;
  if (highlight) hlTip.textContent = t('highlightTip').replace('{code}', highlight);
}

/* ---------- 5. 导出 ---------- */
function codeTextColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 0.299 * r + 0.587 * g + 0.114 * b > 150 ? 'rgba(0,0,0,.78)' : 'rgba(255,255,255,.88)';
}

/** 导出大图：豆子图 + 四边行列标尺（每 10 格加深）+ 格内色号，可选附色卡清单 */
function drawExport(withLegend) {
  const colors = pal();
  const cell = 24, w = stats.w, h = gridH;
  const margin = 20, ruler = 28, titleH = 44, legendCols = 3, rowH = 34;
  const legendRows = withLegend ? Math.ceil(legend.length / legendCols) : 0;
  const itemW = Math.min(300, Math.max(180, (w * cell + ruler * 2) / legendCols));
  const legendW = Math.max(w * cell + ruler * 2, legendCols * itemW);
  const originX = margin + ruler, originY = margin + titleH + ruler;
  const canvas = document.createElement('canvas');
  canvas.width = legendW + margin * 2;
  canvas.height = originY + h * cell + ruler + (withLegend ? 66 + legendRows * rowH : margin);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#16181d';
  ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(t('exportTitle') + ' ' + w + ' × ' + h + ' · ' + brandName(), margin, margin + 20);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = grid[y * w + x];
      const px = originX + x * cell, py = originY + y * cell;
      if (idx < 0) { ctx.fillStyle = '#f2f4f7'; ctx.fillRect(px, py, cell, cell); continue; }
      const c = colors[idx];
      ctx.fillStyle = c.hex;
      ctx.beginPath(); ctx.arc(px + cell / 2, py + cell / 2, cell / 2 - 1, 0, Math.PI * 2); ctx.fill();
      if (S.printCodes) {
        ctx.fillStyle = codeTextColor(c.hex);
        ctx.font = 'bold 9px Consolas,monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(c.code, px + cell / 2, py + cell / 2 + 0.5);
        ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
      }
    }
  }
  ctx.lineWidth = 1;
  for (let x = 0; x <= w; x++) {
    ctx.strokeStyle = x % 10 === 0 ? 'rgba(0,0,0,.4)' : 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.moveTo(originX + x * cell + 0.5, originY); ctx.lineTo(originX + x * cell + 0.5, originY + h * cell); ctx.stroke();
  }
  for (let y = 0; y <= h; y++) {
    ctx.strokeStyle = y % 10 === 0 ? 'rgba(0,0,0,.4)' : 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.moveTo(originX, originY + y * cell + 0.5); ctx.lineTo(originX + w * cell, originY + y * cell + 0.5); ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let x = 0; x < w; x++) {
    const cx = originX + x * cell + cell / 2, major = (x + 1) % 10 === 0;
    ctx.fillStyle = major ? '#2563eb' : '#8a8f98';
    ctx.font = major ? 'bold 10px Consolas,monospace' : '10px Consolas,monospace';
    ctx.fillText(String(x + 1), cx, originY - ruler / 2);
    ctx.fillText(String(x + 1), cx, originY + h * cell + ruler / 2);
  }
  for (let y = 0; y < h; y++) {
    const cy = originY + y * cell + cell / 2, major = (y + 1) % 10 === 0;
    ctx.fillStyle = major ? '#2563eb' : '#8a8f98';
    ctx.font = major ? 'bold 10px Consolas,monospace' : '10px Consolas,monospace';
    ctx.textAlign = 'right'; ctx.fillText(String(y + 1), originX - 5, cy);
    ctx.textAlign = 'left'; ctx.fillText(String(y + 1), originX + w * cell + 5, cy);
  }
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';

  if (withLegend) {
    let ly = originY + h * cell + ruler + 40;
    ctx.fillStyle = '#16181d';
    ctx.font = 'bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(t('legendTitle') + '（' + legend.length + '，' + t('sortedByUsage') + '）', margin, ly);
    ly += 20;
    ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
    legend.forEach((c, i) => {
      const col = i % legendCols, row = Math.floor(i / legendCols);
      const x = margin + col * itemW, y = ly + row * rowH;
      ctx.fillStyle = c.hex; ctx.fillRect(x, y, 20, 20);
      ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.strokeRect(x + 0.5, y + 0.5, 20, 20);
      ctx.fillStyle = '#16181d';
      const nm = S.lang === 'zh' ? (c.name || '') : (c.en || '');
      ctx.fillText(c.code + (nm ? ' ' + nm : '') + ' ' + c.hex + ' ×' + c.count, x + 28, y + 15);
    });
  }
  return canvas;
}

function downloadCanvas(canvas, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

function exportPng(withLegend) {
  if (!stats) return;
  const c = drawExport(withLegend);
  downloadCanvas(c, 'beadforge_' + brandName() + '_' + stats.w + 'x' + stats.h + (withLegend ? '_legend' : '') + '.png');
}

function exportCsv() {
  if (!stats) return;
  const lines = [
    [t('csvBrand'), t('csvCode'), t('csvName'), t('csvHex'), t('csvCount')].join(','),
    ...legend.map((c) => [brandName(), c.code, (S.lang === 'zh' ? c.name : c.en) || '', c.hex, c.count].join(',')),
    '',
    [t('csvSize'), stats.w + '×' + stats.h, '', t('csvTotal') + stats.beads, ''].join(',')
  ];
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.download = 'beadforge_' + brandName() + '_' + stats.w + 'x' + stats.h + '.csv';
  a.href = URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
}

const t = (k) => (I18N[S.lang] && I18N[S.lang][k]) || k;

function applyI18n() {
  document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  // 分段按钮文案
  const setSeg = (id, map) => {
    document.querySelectorAll('#' + id + ' button').forEach((b) => { b.textContent = t(map[b.dataset.v]); });
  };
  setSeg('dither', { none: 'ditherOff', fs: 'ditherFs' });
  setSeg('shape', { circle: 'shapeCircle', square: 'shapeSquare' });
  setSeg('showGrid', { 1: 'on', 0: 'off' });
  setSeg('printCodes', { 1: 'onOff', 0: 'offOff' });
  document.getElementById('lang-zh').classList.toggle('on', S.lang === 'zh');
  document.getElementById('lang-en').classList.toggle('on', S.lang === 'en');
  if (stats) renderLegend();
}

/* ---------- 7. UI 绑定 ---------- */
const $ = (id) => document.getElementById(id);

function buildBrandSelect() {
  $('brand').innerHTML = BRANDS.map((b) =>
    '<option value="' + b.id + '">' + b.name + '（' + b.note + ' ' + (S.lang === 'zh' ? '色' : 'colors') + '）</option>').join('');
  $('brand').value = S.brand;
}
function buildMaxColorSelect() {
  const opts = maxColorOptions();
  if (!opts.includes(S.maxColors)) S.maxColors = opts[opts.length - 1];
  $('maxColors').innerHTML = opts.map((n) =>
    '<option value="' + n + '">' + n + (S.lang === 'zh' ? ' 种' : '') + (n === 24 ? (S.lang === 'zh' ? '（推荐）' : ' (recommended)') : '') +
    (n === pal().length ? (S.lang === 'zh' ? '（全部颜色）' : ' (all colors)') : '') + '</option>').join('');
  $('maxColors').value = S.maxColors;
}
function buildPresets() {
  const list = [[29, S.lang === 'zh' ? '小底板 29' : 'Small board 29'], [58, S.lang === 'zh' ? '2×2 拼板 58' : '2×2 board 58'], [87, S.lang === 'zh' ? '3×3 拼板 87' : '3×3 board 87']];
  $('presets').innerHTML = list.map(([n, label]) =>
    '<button type="button" data-w="' + n + '" class="' + (S.width === n ? 'on' : '') + '">' + label + '</button>').join('');
  $('presets').querySelectorAll('button').forEach((b) => {
    b.onclick = () => { S.width = Number(b.dataset.w); $('width').value = S.width; $('wLabel').textContent = S.width; buildPresets(); scheduleGenerate(); };
  });
}

let genTimer = 0;
function scheduleGenerate() { clearTimeout(genTimer); genTimer = setTimeout(generate, 120); }

function loadImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(file);
  const image = new Image();
  image.onload = () => {
    img = image;
    $('drop').hidden = true;
    $('main').hidden = false;
    generate();
  };
  image.src = objectUrl;
}

function showMain() {
  $('drop').hidden = true;
  $('main').hidden = false;
}

function resetAll() {
  clearTimeout(genTimer);
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = ''; img = null; grid = new Int16Array(0); gridH = 0; stats = null; legend = []; highlight = null;
  $('main').hidden = true; $('drop').hidden = false; $('legendPanel').hidden = true;
}

function init() {
  buildBrandSelect(); buildMaxColorSelect(); buildPresets(); applyI18n();

  $('file').addEventListener('change', (e) => { loadImage(e.target.files[0]); e.target.value = ''; });
  $('drop').addEventListener('click', () => $('file').click());
  ['dragenter', 'dragover'].forEach((ev) => $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.remove('over'); }));
  $('drop').addEventListener('drop', (e) => loadImage(e.dataTransfer.files[0]));
  window.addEventListener('paste', (e) => {
    const item = Array.from((e.clipboardData && e.clipboardData.items) || []).find((i) => i.type.startsWith('image/'));
    if (item) loadImage(item.getAsFile());
  });

  $('brand').addEventListener('change', () => { S.brand = $('brand').value; buildMaxColorSelect(); generate(); });
  $('width').addEventListener('input', () => { S.width = Number($('width').value); $('wLabel').textContent = S.width; buildPresets(); scheduleGenerate(); });
  $('brightness').addEventListener('input', () => { S.brightness = Number($('brightness').value); $('bLabel').textContent = (S.brightness > 0 ? '+' : '') + S.brightness; scheduleGenerate(); });
  $('maxColors').addEventListener('change', () => { S.maxColors = Number($('maxColors').value); generate(); });
  const segBind = (id, key, cast) => {
    $(id).querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        S[key] = cast(b.dataset.v);
        $(id).querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
        if (key === 'showGrid' || key === 'printCodes') renderPreview();
        else generate();
      };
    });
  };
  segBind('dither', 'dither', String);
  segBind('shape', 'shape', String);
  segBind('showGrid', 'showGrid', (v) => v === '1');
  segBind('printCodes', 'printCodes', (v) => v === '1');

  $('reset').addEventListener('click', resetAll);
  $('dlFull').addEventListener('click', () => exportPng(true));
  $('dlPlain').addEventListener('click', () => exportPng(false));
  $('dlCsv').addEventListener('click', exportCsv);
  $('lang-zh').addEventListener('click', () => { S.lang = 'zh'; buildBrandSelect(); buildMaxColorSelect(); buildPresets(); applyI18n(); });
  $('lang-en').addEventListener('click', () => { S.lang = 'en'; buildBrandSelect(); buildMaxColorSelect(); buildPresets(); applyI18n(); });

  $('wLabel').textContent = S.width;
  $('bLabel').textContent = '0';
}

/* 供自动化测试 / 二次开发使用的小接口 */
window.BeadForge = {
  BRANDS,
  get state() { return { ...S, stats, legend, colors: legend.length }; },
  load(image) { img = image; showMain(); generate(); return { stats, legend }; },
  generate, exportPng, exportCsv, drawExport,
  set(key, value) { S[key] = value; if (key === 'brand') buildMaxColorSelect(); }
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
